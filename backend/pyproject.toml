[project]
name = "nova-island-backend"
version = "0.1.0"
description = "Nova Island community API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiomysql>=0.2,<1.0",
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.7,<3.0",
    "pyjwt>=2.9,<3.0",
    "python-multipart>=0.0.32",
    "redis>=5.0,<6.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1.0",
    "httpx2>=2.0,<3.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.9,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
